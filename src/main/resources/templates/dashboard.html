<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TestBed - 通用功能验证平台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .tool-card { transition: transform 0.15s, box-shadow 0.15s; cursor: pointer; }
        .tool-card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,.12); }
        .tool-icon { font-size: 2.5rem; }
    </style>
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="text-center mb-5">
        <h1 class="display-5 fw-bold">Spring Boot TestBed</h1>
        <p class="lead text-muted">通用功能验证平台 — 每个工具一个入口，每个用例可执行可验证</p>
    </div>

    <div class="row g-4">
        <!-- Spring AI Prompt AB -->
        <div class="col-md-6 col-lg-4">
            <a href="/page/prompt-ab" class="text-decoration-none">
                <div class="card tool-card h-100 border-0 shadow-sm">
                    <div class="card-body text-center p-4">
                        <div class="tool-icon mb-3">🧪</div>
                        <h5 class="card-title fw-bold">Spring AI Prompt AB</h5>
                        <p class="card-text text-muted small">
                            Prompt A/B 测试框架<br>
                            实验管理 · 变体路由 · 评估指标
                        </p>
                        <span class="badge bg-primary">4 个功能模块</span>
                    </div>
                </div>
            </a>
        </div>

        <!-- 占位：未来工具 -->
        <div class="col-md-6 col-lg-4">
            <div class="card h-100 border-0 shadow-sm" style="opacity: 0.5;">
                <div class="card-body text-center p-4">
                    <div class="tool-icon mb-3">➕</div>
                    <h5 class="card-title fw-bold">待接入工具</h5>
                    <p class="card-text text-muted small">
                        Spring Insight 等<br>
                        后续项目可接入此平台
                    </p>
                    <span class="badge bg-secondary">敬请期待</span>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
