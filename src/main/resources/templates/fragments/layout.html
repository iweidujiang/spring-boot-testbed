<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- 面包屑导航 -->
<nav th:fragment="breadcrumb(items)" aria-label="breadcrumb">
    <ol class="breadcrumb mb-4">
        <li class="breadcrumb-item"><a href="/">TestBed</a></li>
        <li th:each="item, iterStat : ${items}"
            th:classappend="${!iterStat.last} ? 'breadcrumb-item' : 'breadcrumb-item active'"
            th:aria-current="${iterStat.last} ? 'page' : null">
            <a th:if="${!iterStat.last}" th:href="${item.url}" th:text="${item.label}"></a>
            <span th:if="${iterStat.last}" th:text="${item.label}"></span>
        </li>
    </ol>
</nav>

<!-- 公共页脚 -->
<footer th:fragment="footer" class="mt-5 py-3 border-top text-center text-muted">
    <div class="container">
        <small>Spring Boot TestBed &middot; 通用功能验证平台</small>
    </div>
</footer>

</html>
