<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spring AI Prompt AB - TestBed</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .module-card { transition: transform 0.15s, box-shadow 0.15s; cursor: pointer; }
        .module-card:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0,0,0,.1); }
        .module-count { font-size: 1.5rem; font-weight: 700; }
    </style>
</head>
<body class="bg-light">

<div class="container py-4">
    <div th:replace="~{fragments/layout :: breadcrumb(items=${breadcrumb})}"></div>

    <h2 class="mb-4">Spring AI Prompt AB</h2>
    <p class="text-muted mb-4">Prompt A/B 测试框架 — 选择功能模块进入测试用例</p>

    <div class="row g-4">
        <div class="col-md-6 col-lg-3">
            <a href="/page/prompt-ab/experiments" class="text-decoration-none">
                <div class="card module-card h-100 border-0 shadow-sm">
                    <div class="card-body p-4">
                        <div class="module-count text-primary mb-2">5</div>
                        <h6 class="fw-bold">实验管理</h6>
                        <p class="text-muted small mb-0">创建实验、状态流转、非法操作拦截</p>
                    </div>
                </div>
            </a>
        </div>
        <div class="col-md-6 col-lg-3">
            <div class="card h-100 border-0 shadow-sm" style="opacity:0.6; cursor:default;">
                <div class="card-body p-4">
                    <div class="module-count text-secondary mb-2">0</div>
                    <h6 class="fw-bold">变体管理</h6>
                    <p class="text-muted small mb-0">创建变体、流量调整、激活停用</p>
                </div>
            </div>
        </div>
        <div class="col-md-6 col-lg-3">
            <div class="card h-100 border-0 shadow-sm" style="opacity:0.6; cursor:default;">
                <div class="card-body p-4">
                    <div class="module-count text-secondary mb-2">0</div>
                    <h6 class="fw-bold">聊天路由</h6>
                    <p class="text-muted small mb-0">粘性路由、流量分配、变体回显</p>
                </div>
            </div>
        </div>
        <div class="col-md-6 col-lg-3">
            <div class="card h-100 border-0 shadow-sm" style="opacity:0.6; cursor:default;">
                <div class="card-body p-4">
                    <div class="module-count text-secondary mb-2">0</div>
                    <h6 class="fw-bold">评估指标</h6>
                    <p class="text-muted small mb-0">评估记录、聚合统计、Micrometer 指标</p>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
